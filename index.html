<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYLER_WILKINS // PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>

    <nav class="border-bottom">
        <div class="nav-container">
            <div class="logo">TYLER_WILKINS</div>
            <div class="nav-links">
                <a href="#about">./ABOUT</a>
                <a href="#portfolio">./ART</a>
                <a href="https://www.instagram.com/trad.tyler/" target="_blank">./INSTA</a>
            </div>
        </div>
    </nav>

    <main>
        <section id="about" class="border-bottom container">
            <h2>> INITIALIZING_BIO</h2>
            <p>I am an artist focused on [Your Style]. My work explores the intersection of brutalist design and traditional themes.</p>
        </section>

        <section id="portfolio" class="border-bottom container">
            <div class="section-header">
                <h2>> ART_OVERVIEW</h2>
                <div class="filter-tools">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                    <button class="filter-btn" data-filter="tattoo">TATTOO</button>
                    <button class="filter-btn" data-filter="paint">PAINT</button>
                </div>
            </div>
            <div class="gallery">
                <!-- Example Card -->
                <div class="art-card" data-category="tattoo">
                    <img src="https://via.placeholder.com/400" alt="Art 1">
                    <div class="art-meta">FILE: TAT_001.JPG</div>
                </div>
            </div>
        </section>

        <section id="booking" class="container">
            <h2>> SCHEDULE_LINK</h2>
            <p>Current Status: READY_FOR_INPUT</p>
            <a href="YOUR_CALENDAR_URL" class="booking-btn">RUN_BOOKING_PROMPT.EXE</a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
